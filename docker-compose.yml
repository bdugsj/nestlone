# Nestlone + CodeWhale Kali container stack.
#
# Start:
#   LLM_API_KEY=sk-... docker compose up -d
#
# Configure LLM provider via env:
#   LLM_API_KEY        — required, your model provider API key
#   LLM_BASE_URL       — optional, custom base URL (Ollama, local proxy, etc.)
#   LLM_MODEL          — optional, model id override
#   NVD_API_KEY        — optional, NVD API key for CVE rate limits
#   GITHUB_TOKEN        — optional, GitHub token for advisory API rate limits
#
# Access:
#   Web UI:  http://localhost:7878
#   TUI:     docker exec -it nestlone codewhale-tui
#   Shell:   docker exec -it nestlone bash

services:
  nestlone:
    build:
      context: .
      dockerfile: Dockerfile.kali
    image: nestlone-kali:latest
    container_name: nestlone
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - codewhale_state:/home/nestlone/.codewhale
      # Bind mount workspace to host ./workspace — survives docker compose down -v
      - type: bind
        source: ./workspace
        target: /workspace
      - type: bind
        source: ./mcp
        target: /opt/nestlone/mcp
        read_only: true
      - type: bind
        source: ./config.toml
        target: /home/nestlone/.codewhale/config.toml
        read_only: true
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-}
      - CODEWHALE_SESSION_MODEL=${CODEWHALE_SESSION_MODEL:-}
      - NVD_API_KEY=${NVD_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    restart: unless-stopped
    init: true
    # Security hardening
    read_only: false  # workspace needs writes
    security_opt:
      - no-new-privileges:true
    # For nmap raw socket access (optional, remove if not needed)
    cap_add:
      - NET_RAW
      - NET_ADMIN

volumes:
  codewhale_state:
