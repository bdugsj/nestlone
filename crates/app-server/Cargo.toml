[package]
name = "nestlone-app-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "App-server transport for Codewhale runtime integrations"
# `codewhale app-server` is owned by nestlone-cli; this crate is library-only.
autobins = false

[dependencies]
anyhow.workspace = true
axum.workspace = true
nestlone-agent = { path = "../agent", version = "0.0.2" }
nestlone-config = { path = "../config", version = "0.0.2" }
nestlone-core = { path = "../core", version = "0.0.2" }
nestlone-execpolicy = { path = "../execpolicy", version = "0.0.2" }
nestlone-hooks = { path = "../hooks", version = "0.0.2" }
nestlone-mcp = { path = "../mcp", version = "0.0.2" }
nestlone-protocol = { path = "../protocol", version = "0.0.2" }
nestlone-release = { path = "../release", version = "0.0.2" }
nestlone-state = { path = "../state", version = "0.0.2" }
nestlone-tools = { path = "../tools", version = "0.0.2" }
serde.workspace = true
serde_json.workspace = true
rustls.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
reqwest = { workspace = true, features = ["json"] }
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower = "0.5"
