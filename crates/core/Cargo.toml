[package]
name = "nestlone-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core runtime boundaries for Nestlone"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
nestlone-agent = { path = "../agent", version = "0.0.2" }
nestlone-config = { path = "../config", version = "0.0.2" }
nestlone-execpolicy = { path = "../execpolicy", version = "0.0.2" }
nestlone-hooks = { path = "../hooks", version = "0.0.2" }
nestlone-mcp = { path = "../mcp", version = "0.0.2" }
nestlone-protocol = { path = "../protocol", version = "0.0.2" }
nestlone-state = { path = "../state", version = "0.0.2" }
nestlone-tools = { path = "../tools", version = "0.0.2" }
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
