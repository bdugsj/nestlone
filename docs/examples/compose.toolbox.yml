# Opt-in Nestlone toolbox workflow.
#
# Usage:
#   NESTLONE_IMAGE=ghcr.io/bdugsj/nestlone:vX.Y.Z \
#   NESTLONE_TOOLBOX_IMAGE=nestlone-toolbox:my-project \
#   NESTLONE_HOME_VOLUME=nestlone-my-project-home \
#   NESTLONE_WORKSPACE="$PWD" \
#   docker compose -f docs/examples/compose.toolbox.yml run --rm nestlone
#
# Keep NESTLONE_HOME_VOLUME distinct per project so sessions, config, skills,
# memory, and queued work do not bleed across workspaces.

services:
  nestlone:
    image: ${NESTLONE_TOOLBOX_IMAGE:-nestlone-toolbox:local}
    build:
      context: ../..
      dockerfile: docs/examples/Dockerfile.toolbox
      args:
        NESTLONE_IMAGE: ${NESTLONE_IMAGE:-ghcr.io/bdugsj/nestlone:latest}
        TOOLBOX_PACKAGES: ${TOOLBOX_PACKAGES:-git openssh-client curl build-essential pkg-config python3 python3-pip nodejs npm}
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL
      - DEEPSEEK_NO_COLOR
    volumes:
      - nestlone-home:/home/nestlone/.nestlone
      - ${NESTLONE_WORKSPACE:?set NESTLONE_WORKSPACE to the project directory}:/workspace
      # Mount SSH material only for projects that need it, and prefer read-only.
      # - ${HOME}/.ssh:/home/nestlone/.ssh:ro
      # Mount local CA certificates only when starting through a command that
      # runs `sudo update-ca-certificates` inside this toolbox image.
      # - ${NESTLONE_CERTS_DIR:-../../docker/certs}:/usr/local/share/ca-certificates/local:ro
    working_dir: /workspace
    stdin_open: true
    tty: true

volumes:
  nestlone-home:
    name: ${NESTLONE_HOME_VOLUME:-nestlone-toolbox-home}
