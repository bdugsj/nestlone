name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            release_os: linux
            release_arch: x64
            ext: ''
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            release_os: linux
            release_arch: arm64
            ext: ''
          - target: x86_64-apple-darwin
            os: macos-13
            release_os: macos
            release_arch: x64
            ext: ''
          - target: aarch64-apple-darwin
            os: macos-14
            release_os: macos
            release_arch: arm64
            ext: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            release_os: windows
            release_arch: x64
            ext: .exe

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: startsWith(matrix.release_os, 'linux') && matrix.target != 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release -p nestlone-cli -p nestlone-tui --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          ext="${{ matrix.ext }}"
          os_arch="${{ matrix.release_os }}-${{ matrix.release_arch }}"
          bin_dir="target/${{ matrix.target }}/release"
          # Tarball keeps plain binary names for install.sh.
          mkdir -p dist
          cp "${bin_dir}/nestlone${ext}" dist/nestlone${ext}
          cp "${bin_dir}/nest${ext}" dist/nest${ext}
          cp "${bin_dir}/nestlone-tui${ext}" dist/nestlone-tui${ext}
          cp install.sh dist/ 2>/dev/null || true
          tar -czf "nestlone-${os_arch}.tar.gz" -C dist .

          # Standalone self-update assets use {prefix}-{os}-{arch} naming.
          cp "${bin_dir}/nestlone${ext}" "nestlone-${os_arch}${ext}"
          cp "${bin_dir}/nest${ext}" "nest-${os_arch}${ext}"
          cp "${bin_dir}/nestlone-tui${ext}" "nestlone-tui-${os_arch}${ext}"
          sha256sum "nestlone-${os_arch}${ext}" "nestlone-tui-${os_arch}${ext}" "nest-${os_arch}${ext}" \
            > "nestlone-artifacts-sha256-${{ matrix.target }}.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nestlone-${{ matrix.target }}
          path: |
            nestlone-${{ matrix.release_os }}-${{ matrix.release_arch }}.tar.gz
            nestlone-${{ matrix.release_os }}-${{ matrix.release_arch }}${{ matrix.ext }}
            nest-${{ matrix.release_os }}-${{ matrix.release_arch }}${{ matrix.ext }}
            nestlone-tui-${{ matrix.release_os }}-${{ matrix.release_arch }}${{ matrix.ext }}
            nestlone-artifacts-sha256-${{ matrix.target }}.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nestlone-*
          merge-multiple: true

      - name: Merge checksum manifests
        run: cat nestlone-artifacts-sha256-*.txt > nestlone-artifacts-sha256.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nestlone-*.tar.gz
            nestlone-linux-x64
            nest-linux-x64
            nestlone-tui-linux-x64
            nestlone-linux-arm64
            nest-linux-arm64
            nestlone-tui-linux-arm64
            nestlone-macos-x64
            nest-macos-x64
            nestlone-tui-macos-x64
            nestlone-macos-arm64
            nest-macos-arm64
            nestlone-tui-macos-arm64
            nestlone-windows-x64.exe
            nest-windows-x64.exe
            nestlone-tui-windows-x64.exe
            nestlone-artifacts-sha256.txt
          generate_release_notes: true
